# ==============================================================================
# base.yaml — Default configuration for all environments.
# Secrets must NEVER appear here — inject via environment variables only.
# This file is version-controlled. Changes go through PR review.
# ==============================================================================

config_version: "1.0.0"

system:
  name: "trading-bot"
  version: "0.1.0"

logging:
  level: "INFO"
  format: "json"           # json | console
  include_caller: false

database:
  pool_min: 5
  pool_max: 20
  command_timeout: 30      # seconds

prometheus:
  port: 9090
  path: "/metrics"
  enabled: true

otel:
  service_name: "trading-bot"
  exporter: "console"      # console | otlp
  traces_sampler: "always_on"
  # Sampling policy per span type (overrides sampler for hot paths)
  order_sample_rate: 1.0   # 100% of order spans
  data_fetch_sample_rate: 0.1  # 10% of data fetch spans

feature_flags:
  refresh_interval_seconds: 30
  defaults:
    live_trading_enabled: false   # KILL SWITCH — always false by default
    paper_trading_enabled: true
    websocket_enabled: true
    data_ingestion_enabled: true
    alerting_enabled: true

risk:
  # Drawdown circuit breaker tiers
  tier1_daily_drawdown_pct: 0.05   # 5% → pause new positions
  tier2_daily_drawdown_pct: 0.10   # 10% → full halt
  tier3_daily_drawdown_pct: 0.15   # 15% → emergency liquidation
  # Portfolio-level limits
  max_portfolio_leverage: 1.0      # spot only — no leverage
  reserved_cash_floor_pct: 0.10   # keep ≥ 10% in cash
  max_single_asset_pct: 0.30       # max 30% of portfolio in one asset
  max_single_exchange_pct: 0.50   # max 50% on one exchange
  # Position sizing
  kelly_fraction: 0.25             # fractional Kelly (1/4)
  volatility_target_annual: 0.15  # 15% annualised vol target

time_sync:
  warn_drift_ms: 100     # log warning if drift > 100ms
  alert_drift_ms: 250    # send alert if drift > 250ms
  halt_drift_ms: 500     # halt trading if drift > 500ms
  check_interval_seconds: 60

data:
  raw_base_path: "trading_bot/data/raw"
  processed_base_path: "trading_bot/data/processed"
  replay_base_path: "trading_bot/data/replay"
  # Freshness thresholds — alert if data older than N × expected_interval
  freshness_multiplier: 2
  # Anomaly detection
  return_zscore_threshold: 5.0

scheduler:
  # APScheduler — persistent job store uses DATABASE_URL
  timezone: "UTC"
  max_instances: 3
  coalesce: true
  misfire_grace_time: 300   # seconds

exchange:
  binance:
    base_url: "https://api.binance.com"
    testnet_url: "https://testnet.binance.vision"
    rate_limit:
      requests_per_minute: 1200
      orders_per_second: 10
    timeout_seconds: 10
    retry_attempts: 4
    retry_backoff_base: 2    # exponential: 2^n seconds

  alpaca:
    base_url: "https://paper-api.alpaca.markets"
    paper: true                              # always paper by default — live needs ALLOW_LIVE_TRADING=true
    allow_live_trading: false
    allowed_etf_symbols:
      - "SPY"
      - "QQQ"
      - "SOXX"
      - "IBIT"
    timeout_seconds: 30
    retry_attempts: 4
    # ── Per-symbol strategy parameter overrides ──────────────────────────────
    # Different ETFs warrant different SMA windows and RSI thresholds because
    # their volatility profiles differ significantly.
    # Promotion pipeline uses these params — changing them resets paper evidence.
    etf_strategy_params:
      SPY:
        sma_fast: 20
        sma_slow: 50
        rsi_period: 14
        rsi_oversold: 32.0    # slightly tighter — SPY rarely hits extreme RSI
        rsi_overbought: 68.0
      QQQ:
        sma_fast: 15
        sma_slow: 40
        rsi_period: 14
        rsi_oversold: 30.0
        rsi_overbought: 70.0
      SOXX:
        sma_fast: 10
        sma_slow: 30
        rsi_period: 14
        rsi_oversold: 28.0    # wider zone for semiconductor sector volatility
        rsi_overbought: 72.0
      IBIT:
        sma_fast: 10
        sma_slow: 25
        rsi_period: 14
        rsi_oversold: 25.0    # BTC-linked; extreme oversold common
        rsi_overbought: 75.0

latency_budgets_ms:
  data_ingestion: 50
  signal_generation: 100
  risk_check: 20
  order_submission: 200
  signal_to_fill_p99: 500

audit_log:
  enabled: true
  # Hash algorithm for event chain
  hash_algorithm: "sha256"
  # Retention — enforced by DB partition policy
  retention_days: 365

capital_allocation:
  # Per-strategy capital cap (fraction of total equity)
  max_capital_per_strategy_pct: 0.30    # max 30% in any single strategy
  # Per-asset capital cap
  max_capital_per_asset_pct: 0.20       # max 20% in any single asset
  # Loss budgets — new entries blocked when limit is reached
  daily_loss_budget_pct: 0.03           # 3% daily loss stops new entries
  weekly_loss_budget_pct: 0.07          # 7% weekly loss stops new entries
  # Correlated exposure limit
  max_correlated_exposure_pct: 0.50     # max 50% in correlated assets

market_context:
  enabled: true
  refresh_interval_minutes: 60   # how often scheduler re-fetches all providers

trading:
  crypto:
    exchange: "binance"
    symbols:
      - "BTC/USDT"
      - "ETH/USDT"
    timeframes:
      - "1h"
      - "1d"
  equity:
    exchange: "alpaca"
    symbols:
      - "SPY"
      - "QQQ"
      - "SOXX"
      - "IBIT"   # Bitcoin spot ETF — trades on US equity hours via Alpaca
