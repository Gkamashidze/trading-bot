# feature_flags.yaml — Declarative default feature flag definitions.
# Actual runtime state is stored in DB (overrides these defaults).
# Changes to this file require PR review + CHANGELOG entry.

flags:
  # ── Kill switches (safety-first) ──────────────────────────────────────────
  live_trading_enabled:
    default: false
    description: "Master kill switch — enables live order submission"
    owner: "ops"
    critical: true    # changes to critical flags require dual-approval

  paper_trading_enabled:
    default: true
    description: "Enables paper trading via Alpaca Paper / Binance Testnet"
    owner: "ops"
    critical: false

  # ── Infrastructure ────────────────────────────────────────────────────────
  websocket_enabled:
    default: false
    description: "Enables real-time WebSocket market data streams (Stage 2+)"
    owner: "infra"
    critical: false

  data_ingestion_enabled:
    default: true
    description: "Enables APScheduler daily OHLCV ingestion jobs"
    owner: "data"
    critical: false

  alerting_enabled:
    default: true
    description: "Enables Telegram / alert notifications"
    owner: "ops"
    critical: false

  prometheus_enabled:
    default: true
    description: "Enables Prometheus /metrics endpoint"
    owner: "infra"
    critical: false

  # ── Per-strategy flags (Stage 3+) ─────────────────────────────────────────
  strategy_sma_enabled:
    default: false
    description: "Enables SMA crossover strategy signal generation"
    owner: "quant"
    critical: false

  strategy_rsi_enabled:
    default: false
    description: "Enables RSI mean-reversion strategy signal generation"
    owner: "quant"
    critical: false

  # ── Research safety ───────────────────────────────────────────────────────
  canary_trade_enabled:
    default: false
    description: "Enables synthetic canary trades at market open (Stage 5+)"
    owner: "ops"
    critical: false

  # ── Asset universe — per-group activation flags ───────────────────────────
  # These flags gate data ingestion and paper trading for each expansion phase.
  # Flip a flag to promote an asset group from disabled → research → paper.
  # live_trading_enabled must also be true for any live execution (always false).

  asset_group_crypto_phase1_enabled:
    default: true
    description: "Phase 1 crypto: BTC/USDT + ETH/USDT — core paper universe"
    owner: "quant"
    critical: false

  asset_group_crypto_phase2_enabled:
    default: false
    description: "Phase 2 crypto: SOL/USDT — first expansion candidate"
    owner: "quant"
    critical: false

  asset_group_crypto_phase3_enabled:
    default: false
    description: "Phase 3 crypto: BNB/USDT + XRP/USDT (lower caps; activate after SOL gates pass)"
    owner: "quant"
    critical: false

  asset_group_crypto_phase4_enabled:
    default: false
    description: "Phase 4 crypto: LINK/USDT — oracle token (activate after Phase 3 gates pass)"
    owner: "quant"
    critical: false

  asset_group_etf_wave1_enabled:
    default: true
    description: "Wave 1 ETF: SPY/QQQ/SOXX/IBIT via Alpaca paper API (approved; Stage 5 integration complete)"
    owner: "quant"
    critical: false

  asset_group_etf_phase5_enabled:
    default: false
    description: "Phase 5 ETF remainder: IWM/TLT/GLD via Alpaca (future wave — not yet approved)"
    owner: "quant"
    critical: false

  asset_experimental_doge_enabled:
    default: false
    description: "EXPERIMENTAL: DOGE/USDT high-volatility meme-risk experiment (hard cap 5%, NOT in default universe)"
    owner: "quant"
    critical: false
