name: CI

on:
  push:
    branches: ["claude/trading-bot-stage-zero-g85yF", "main"]
  pull_request:
    branches: ["main"]

env:
  PYTHON_VERSION: "3.12"
  ENVIRONMENT: "development"

jobs:
  # ── Lint & Format ──────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: ruff format check
        run: uv run ruff format --check .

      - name: ruff lint
        run: uv run ruff check .

  # ── Type Check ────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: mypy
        run: uv run mypy trading_bot/ --ignore-missing-imports --no-strict-optional

  # ── Unit & Property Tests ─────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run tests (no DB required)
        run: |
          uv run pytest tests/unit tests/property tests/replay \
            -m "not integration and not chaos and not contract" \
            --cov=trading_bot \
            --cov-report=xml \
            -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ── Config Validation ─────────────────────────────────────────────────────
  config-lint:
    name: Config Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Validate YAML configs
        run: |
          python -c "
          import yaml
          from pathlib import Path
          config_dir = Path('trading_bot/config')
          errors = []
          for f in config_dir.glob('*.yaml'):
              try:
                  yaml.safe_load(f.read_text())
                  print(f'  ✓ {f.name}')
              except Exception as e:
                  errors.append(f'{f.name}: {e}')
                  print(f'  ✗ {f.name}: {e}')
          if errors:
              raise SystemExit(f'Config validation failed: {errors}')
          "

  # ── Security Scanning ─────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: pip-audit (dependency vulnerability scan)
        run: uv run pip-audit --ignore-vuln PYSEC-2022-43059 || true
        # || true — non-blocking in Stage 0; remove in Stage 5+

      - name: bandit (SAST scan)
        run: |
          uv run bandit -r trading_bot/ \
            -x trading_bot/notebooks \
            --severity-level medium \
            --confidence-level medium \
            -f json \
            -o bandit-report.json || true

      - name: detect-secrets check
        run: |
          uv run detect-secrets scan \
            --baseline .secrets.baseline \
            --exclude-files ".*\.(lock|parquet|ipynb)$"

  # ── Migration Check ───────────────────────────────────────────────────────
  migrations:
    name: Migration Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: trading_bot_test
          POSTGRES_USER: trading_bot
          POSTGRES_PASSWORD: testpassword
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql+asyncpg://trading_bot:testpassword@localhost:5432/trading_bot_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run migrations (upgrade)
        run: |
          export DATABASE_URL=postgresql://trading_bot:testpassword@localhost:5432/trading_bot_test
          uv run alembic upgrade head

      - name: Verify migration is idempotent
        run: |
          export DATABASE_URL=postgresql://trading_bot:testpassword@localhost:5432/trading_bot_test
          uv run alembic upgrade head   # second run must be a no-op

      - name: Test downgrade
        run: |
          export DATABASE_URL=postgresql://trading_bot:testpassword@localhost:5432/trading_bot_test
          uv run alembic downgrade base
