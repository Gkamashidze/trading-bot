[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-bot"
version = "0.1.0"
description = "Professional-grade automated trading system — Stage 0 Infrastructure"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Gkamashidze" }]

dependencies = [
    # ── Core ──────────────────────────────────────────────────────────────
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",

    # ── Data & Numerics ───────────────────────────────────────────────────
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "pyarrow>=16.1.0",          # Parquet read/write
    "pandera>=0.19.3",          # DataFrame schema validation
    "duckdb>=0.10.3",           # OLAP analytics

    # ── Market Data & Exchange ────────────────────────────────────────────
    "ccxt>=4.3.0",
    "yfinance>=0.2.40",
    "pandas-market-calendars>=4.4.1",

    # ── Async / HTTP ──────────────────────────────────────────────────────
    "aiohttp>=3.9.5",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "orjson>=3.10.3",           # fast JSON hot path

    # ── Database ──────────────────────────────────────────────────────────
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "sqlalchemy>=2.0.30",       # alembic dependency + ORM-free typing

    # ── Dashboard & HTTP ──────────────────────────────────────────────────
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",

    # ── Scheduling ────────────────────────────────────────────────────────
    "apscheduler>=3.10.4",

    # ── Resilience ────────────────────────────────────────────────────────
    "tenacity>=8.3.0",

    # ── Logging & Observability ───────────────────────────────────────────
    "structlog>=24.1.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
    "opentelemetry-instrumentation-asyncpg>=0.45b0",
    "opentelemetry-instrumentation-aiohttp-client>=0.45b0",
    "prometheus-client>=0.20.0",

    # ── Feature flags ─────────────────────────────────────────────────────
    "cachetools>=5.3.3",

    # ── Idempotency ───────────────────────────────────────────────────────
    "uuid-utils>=0.9.0",        # UUID v7 (time-ordered)
]

[project.optional-dependencies]
dev = [
    # ── Testing ───────────────────────────────────────────────────────────
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.103.0",      # property-based testing (MANDATORY for risk engine)
    "schemathesis>=3.33.0",     # contract tests for exchange APIs

    # ── Type checking ─────────────────────────────────────────────────────
    "mypy>=1.10.0",
    "pandas-stubs>=2.2.2",
    "types-cachetools>=5.3.0",

    # ── Linting / Formatting ──────────────────────────────────────────────
    "ruff>=0.4.7",

    # ── Security scanning ─────────────────────────────────────────────────
    "detect-secrets>=1.5.0",
    "gibberish-detector>=0.1.1",  # required by detect-secrets gibberish filter
    "pip-audit>=2.7.3",
    "bandit>=1.7.9",

    # ── Mutation testing ──────────────────────────────────────────────────
    "mutmut>=2.4.4",

    # ── Profiling ─────────────────────────────────────────────────────────
    "memray>=1.13.0",

    # ── Commits & changelog ───────────────────────────────────────────────
    "commitizen>=3.27.0",

    # ── pre-commit ────────────────────────────────────────────────────────
    "pre-commit>=3.7.1",
]

# ── Backtesting extras (research env only) ────────────────────────────────
research = [
    "vectorbt>=0.26.2",
    "backtrader>=1.9.78.123",
    "matplotlib>=3.9.0",
    "plotly>=5.22.0",
    "jupyter>=1.0.0",
    "papermill>=2.6.0",
]

[project.scripts]
trading-bot = "trading_bot.main:main"
verify-env   = "scripts.verify_environment:main"

# ── Tool configuration ────────────────────────────────────────────────────

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".claude/", "trading_bot/data 2/"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "S",        # flake8-bandit
    "A",        # flake8-builtins
    "C4",       # flake8-comprehensions
    "DTZ",      # flake8-datetimez (enforce UTC)
    "T20",      # flake8-print (no print() in prod)
    "RUF",      # ruff-specific
    "ASYNC",    # flake8-async
    "TID",      # flake8-tidy-imports
]
ignore = [
    "S101",     # assert in tests is fine
    "S603",     # subprocess — allowed in scripts
    "S607",     # partial paths — allowed in scripts
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
"scripts/**" = ["T20", "S603", "S607"]
"trading_bot/notebooks/**" = ["ALL"]

[tool.mypy]
python_version = "3.12"
exclude = ["trading_bot/data 2/"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
no_implicit_reexport = true
strict_equality = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "ccxt.*",
    "yfinance.*",
    "pandas_market_calendars.*",
    "apscheduler.*",
    "vectorbt.*",
    "backtrader.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--cov=trading_bot",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--strict-markers",
]
markers = [
    "unit: unit tests",
    "integration: integration tests (require DB/network)",
    "property: property-based tests (Hypothesis)",
    "replay: replay regression tests",
    "contract: exchange API contract tests (schemathesis)",
    "chaos: chaos engineering tests",
    "slow: tests that take > 10 seconds",
]

[tool.coverage.run]
branch = true
omit = [
    "trading_bot/notebooks/*",
    "tests/*",
    "scripts/*",
    # Infrastructure requiring live DB/exchange/HTTP — covered by integration tests
    "trading_bot/main.py",
    "trading_bot/health.py",
    "trading_bot/dashboard/*",
    "trading_bot/database/connection.py",
    "trading_bot/observability/metrics.py",
    "trading_bot/observability/tracing.py",
    "trading_bot/exchange/*",
    "trading_bot/utils/signals.py",
    "trading_bot/scheduler/jobs.py",
]

[tool.coverage.report]
# Stage 0: unit-testable code covers domain models + validation.
# DB/exchange/infra modules are excluded above (need integration tests + live services).
# Threshold rises as integration tests are added in later stages.
fail_under = 30
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true
